<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مواقعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: a quiet top bar holding the add form, then a wrapping grid of square tiles — one per site */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #5d6b78;
  --line: #d6dde4;
  --accent: #0f6e6a;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --display: "Readex Pro", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #1a232c; --ink: #e8eef3; --muted: #93a2b0;
    --line: #2b3946; --accent: #4cc2b9; --accent-ink: #0b1a19; --danger: #f2877f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #1a232c; --ink: #e8eef3; --muted: #93a2b0;
  --line: #2b3946; --accent: #4cc2b9; --accent-ink: #0b1a19; --danger: #f2877f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  font-size: 15px; line-height: 1.6;
}
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: 16px; padding-right: 16px;
  padding-block: 28px 48px;
  display: grid; gap: 24px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; margin: 0; text-wrap: balance; }
.count { color: var(--muted); font-size: .92rem; font-variant-numeric: tabular-nums; }

form {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) auto; align-items: end;
}
.field { display: grid; gap: 4px; min-width: 0; }
label { font-size: .85rem; color: var(--muted); font-weight: 500; }
input {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
input#url { direction: ltr; text-align: left; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
button { font: inherit; cursor: pointer; }
.add {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  padding: 10px 26px; font-family: var(--display); font-weight: 500; font-size: 1rem; height: 46px;
}
.add:hover { filter: brightness(1.08); }
.add:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.msg { grid-column: 1 / -1; margin: 0; font-size: .88rem; color: var(--danger); min-height: 0; }
.msg:empty { display: none; }

.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.tile { position: relative; }
.tile a {
  display: grid; align-content: space-between; gap: 14px; aspect-ratio: 1 / 1; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; color: inherit; text-decoration: none;
  transition: transform .15s ease, border-color .15s ease;
}
.tile a:hover { transform: translateY(-3px); border-color: var(--accent); }
.tile a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono {
  width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: #fff;
}
.name { font-family: var(--display); font-weight: 500; font-size: 1.08rem; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.host { color: var(--muted); font-size: .8rem; direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.del {
  position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 1.1rem; line-height: 1;
  opacity: 0; transition: opacity .15s;
}
.tile:hover .del, .del:focus-visible { opacity: 1; }
@media (hover: none) { .del { opacity: .7; } }
.del:hover { color: var(--danger); border-color: var(--line); background: var(--bg); }
.confirm {
  position: absolute; inset: 0; border-radius: var(--radius); background: var(--surface);
  border: 1px solid var(--danger); display: grid; place-content: center; gap: 10px; text-align: center; padding: 12px;
}
.confirm p { margin: 0; font-weight: 500; }
.confirm div { display: flex; gap: 8px; justify-content: center; }
.confirm button { border-radius: 8px; padding: 6px 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.confirm .yes { background: var(--danger); color: #fff; border-color: var(--danger); }

.empty {
  border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 40px 20px;
  text-align: center; color: var(--muted);
}
.empty strong { display: block; font-family: var(--display); color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }
.note { color: var(--muted); font-size: .8rem; margin: 0; flex-basis: 100%; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 14px; font-size: .88rem; }
.tools button:hover { border-color: var(--accent); }
.tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 640px) {
  form { grid-template-columns: 1fr; }
  .add { width: 100%; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  h1 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <header>
    <h1>مواقعي</h1>
    <span class="count" id="count"></span>
  </header>

  <form id="addForm" novalidate>
    <div class="field">
      <label for="name">اسم الموقع</label>
      <input id="name" type="text" placeholder="مثال: منصة استعداد" autocomplete="off">
    </div>
    <div class="field">
      <label for="url">الرابط</label>
      <input id="url" type="text" inputmode="url" placeholder="https://example.com" autocomplete="off">
    </div>
    <button class="add" type="submit">إدخال</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <strong>لا توجد مواقع بعد</strong>
    اكتب اسم الموقع ورابطه في الأعلى ثم اضغط «إدخال»، وسيظهر هنا مربع يفتح الموقع.
  </div>
  <div class="tools">
    <button type="button" id="exportBtn">حفظ نسخة احتياطية</button>
    <button type="button" id="importBtn">استيراد نسخة</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="note" id="note">المواقع محفوظة في هذا المتصفح. لنقلها إلى جهاز آخر احفظ نسخة احتياطية ثم استوردها هناك.</p>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const grid = $("grid"), empty = $("empty"), msg = $("msg"), note = $("note"), count = $("count");
  const LS_KEY = "my-sites-v1";
  let links = [];
  let mode = "loading"; // "db" | "local"

  const hues = [168, 205, 25, 280, 340, 45, 120, 230];
  function colorFor(s) {
    let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0;
    return `hsl(${hues[h % hues.length]} 55% 38%)`;
  }
  function normalize(raw) {
    let u = raw.trim();
    if (!u) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = "https://" + u;
    try {
      const p = new URL(u);
      if (!/^https?:$/.test(p.protocol) || !p.hostname.includes(".")) return null;
      return p.href;
    } catch (e) { return null; }
  }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }
  function toArabicNum(n) { return n.toLocaleString("ar-EG"); }

  function render() {
    grid.textContent = "";
    const sorted = links.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    for (const l of sorted) {
      const tile = document.createElement("div"); tile.className = "tile";
      const a = document.createElement("a"); a.href = l.url; a.target = "_blank"; a.rel = "noopener";
      const mono = document.createElement("span"); mono.className = "mono";
      mono.textContent = (l.name.trim()[0] || "؟"); mono.style.background = colorFor(l.name);
      const txt = document.createElement("div");
      const nm = document.createElement("div"); nm.className = "name"; nm.textContent = l.name;
      const hs = document.createElement("div"); hs.className = "host"; hs.textContent = hostOf(l.url);
      txt.append(nm, hs); a.append(mono, txt);
      const del = document.createElement("button"); del.className = "del"; del.type = "button";
      del.setAttribute("aria-label", "حذف " + l.name); del.textContent = "×";
      del.addEventListener("click", () => askDelete(tile, l));
      tile.append(a, del); grid.append(tile);
    }
    empty.hidden = links.length > 0 || mode === "loading";
    count.textContent = links.length ? toArabicNum(links.length) + (links.length === 1 ? " موقع" : links.length === 2 ? " موقعان" : " مواقع") : "";
  }

  function askDelete(tile, l) {
    if (tile.querySelector(".confirm")) return;
    const box = document.createElement("div"); box.className = "confirm";
    const p = document.createElement("p"); p.textContent = "حذف «" + l.name + "»؟";
    const row = document.createElement("div");
    const yes = document.createElement("button"); yes.type = "button"; yes.className = "yes"; yes.textContent = "حذف";
    const no = document.createElement("button"); no.type = "button"; no.textContent = "إلغاء";
    no.addEventListener("click", () => box.remove());
    yes.addEventListener("click", () => removeLink(l.id));
    row.append(yes, no); box.append(p, row); tile.append(box); no.focus();
  }

  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(links)); } catch (e) {} }
  function loadLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { return []; } }

  async function addLink(name, url) {
    const item = { name, url, createdAt: Date.now() };
    item.id = "l" + item.createdAt + Math.random().toString(36).slice(2, 6);
    links.push(item); saveLocal(); render();
    return true;
  }
  async function removeLink(id) {
    links = links.filter((l) => l.id !== id); saveLocal(); render();
  }

  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(links, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "mawaqi-backup.json";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data)) throw 0;
      const have = new Set(links.map((l) => l.url));
      let added = 0;
      for (const d of data) {
        if (!d || typeof d.name !== "string" || typeof d.url !== "string") continue;
        const u = normalize(d.url); if (!u || have.has(u)) continue;
        links.push({ id: "l" + Date.now() + Math.random().toString(36).slice(2, 6), name: d.name, url: u, createdAt: d.createdAt || Date.now() });
        have.add(u); added++;
      }
      saveLocal(); render();
      note.textContent = added ? "تم استيراد " + toArabicNum(added) + " موقع." : "لا توجد مواقع جديدة في الملف.";
    } catch (e) { msg.textContent = "الملف غير صالح. اختر ملف نسخة احتياطية صدّرته من هذه الصفحة."; }
    ev.target.value = "";
  });

  $("addForm").addEventListener("submit", async (ev) => {
    ev.preventDefault(); msg.textContent = "";
    const name = $("name").value.trim();
    const url = normalize($("url").value);
    if (!name) { msg.textContent = "اكتب اسم الموقع."; $("name").focus(); return; }
    if (!url) { msg.textContent = "الرابط غير صحيح. اكتبه مثل: example.com أو https://example.com"; $("url").focus(); return; }
    if (mode === "loading") { msg.textContent = "لحظة، الصفحة ما زالت تُحمّل."; return; }
    const ok = await addLink(name, url);
    if (ok) { $("name").value = ""; $("url").value = ""; $("name").focus(); }
  });


  mode = "local"; links = loadLocal(); render();
})();
</script>

</body>
</html>
